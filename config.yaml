horizon: "1h"          # "1d" or "1h" — how far ahead the score is supposed to predict
symbol: "BTCUSDT"

signal:
  # Posts scoring at or below this in absolute value are treated as "no view on BTC"
  # and left out of the account's mean, instead of dragging it toward zero. The
  # prompt scores an off-topic post 0, and ~60% of posts land there.
  relevance_min: 0.0
  # Only act when the aggregate clears this. A near-zero aggregate's sign is a
  # coin flip. NOTE: not yet validated out-of-sample - it is reported alongside
  # the ungated metrics, so compare the two as live periods accumulate.
  deadband: 0.01

sentiment:
  backend: "llm"       # "llm" (Claude) or "vader"
  model: "claude-sonnet-4-6"

trading:
  enabled: false         # master switch. false = decisions are recorded, nothing is sent
  dry_run: true          # even when enabled, simulate unless this is explicitly false
  product_id: "BTC-USD"
  buy_threshold: 0.05    # buy when the aggregate is at least this bullish
  sell_threshold: -0.02  # sell the position when the aggregate is this bearish
  order_size_usd: 25.0   # spend per buy
  max_position_usd: 100.0  # never hold more than this
  min_base_size: 0.000001  # ignore dust when deciding whether a position exists

db_path: "data/tracker.sqlite"
